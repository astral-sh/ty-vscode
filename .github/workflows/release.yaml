# Validate and publish a release, then create its tag and GitHub release.
name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact extension version to release, without a leading v
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

env:
  FETCH_DEPTH: 0

permissions: {}

jobs:
  # Phase 1: Validate the release and generate the Build ID.
  # We have to do this ahead-of-time, and store it as a job output,
  # to ensure that we use the same Build ID across all build jobs.
  validate-release:
    name: Validate release
    if: github.repository == 'astral-sh/ty-vscode' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      release-build-id: ${{ steps.release-build-id-generator.outputs.release-build-id }}
      nightly-build-id: ${{ steps.nightly-build-id-generator.outputs.nightly-build-id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ env.FETCH_DEPTH }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - name: Validate release metadata
        id: metadata
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import tomllib
          from pathlib import Path

          version = os.environ["VERSION"]
          if not re.fullmatch(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", version):
              raise SystemExit(f"Invalid extension version: {version!r}")
          package = json.loads(Path("package.json").read_text())
          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          for name, metadata in [("package.json", package), ("pyproject.toml", project)]:
              if metadata["version"] != version:
                  raise SystemExit(f"Requested version {version} does not match {name} version {metadata['version']}")
          prerelease = int(version.split(".")[1]) % 2 != 0
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"prerelease={str(prerelease).lower()}", file=output)
          PY

          if git rev-parse --verify --quiet "refs/tags/${VERSION}" >/dev/null; then
            echo "::error::Tag ${VERSION} already exists"
            exit 1
          fi

          echo "Preparing ${VERSION} from ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
        env:
          VERSION: ${{ inputs.version }}
      - name: Generate Build ID (release)
        if: steps.metadata.outputs.prerelease == 'false'
        id: release-build-id-generator
        run: |
          release_build_id="$(python -m build.generate_build_id)"
          echo "release-build-id: ${release_build_id}"
          echo "release-build-id=${release_build_id}" >> "$GITHUB_OUTPUT"
      - name: Generate Build ID (nightly)
        if: steps.metadata.outputs.prerelease == 'true'
        id: nightly-build-id-generator
        run: |
          nightly_build_id="$(python -m build.generate_build_id --pre-release)"
          echo "nightly-build-id: ${nightly_build_id}"
          echo "nightly-build-id=${nightly_build_id}" >> "$GITHUB_OUTPUT"

  # Phase 2: Build the extension on all platforms.
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            code-target: win32-x64
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            code-target: win32-arm64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            code-target: linux-x64
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            code-target: linux-arm64
            arch: aarch64
          - os: ubuntu-22.04
            target: arm-unknown-linux-gnueabihf
            code-target: linux-armhf
            arch: armv7
          - os: macos-latest
            target: x86_64-apple-darwin
            code-target: darwin-x64
          - os: macos-14
            target: aarch64-apple-darwin
            code-target: darwin-arm64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            code-target: alpine-x64
            arch: x86_64
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-musl
            code-target: alpine-arm64
            arch: aarch64

    name: Build (${{ matrix.target }})
    needs: ["validate-release"]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ env.FETCH_DEPTH }}
          persist-credentials: false

      # Install Python dependencies (including ty's native binary).
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      # ARM builds on macOS, which should select ty's universal binary.
      - run: arch -arm64 python -m pip install -t ./bundled/libs --implementation py --no-deps --upgrade -r ./requirements.txt
        if: ${{ startsWith(matrix.os, 'macos') && startsWith(matrix.target, 'aarch64') }}

      # x86_64 builds on macOS, which should select ty's x86_64 binary.
      - run: arch -x86_64 python -m pip install -t ./bundled/libs --implementation py --no-deps --upgrade -r ./requirements.txt
        if: ${{ startsWith(matrix.os, 'macos') && startsWith(matrix.target, 'x86_64') }}

      # ARM builds on Ubuntu, which should select ty's ARM binary.
      - uses: uraimo/run-on-arch-action@f9b26e3a1a408d5fd530d20c17b9f3f4428ff8d9 # v3.1.0
        if: ${{ startsWith(matrix.os, 'ubuntu') && !startsWith(matrix.target, 'x86_64') && !endsWith(matrix.target, 'musl') }}
        with:
          arch: ${{ matrix.arch }}
          distro: ubuntu20.04
          install: |
            apt-get update
            apt-get install -y --no-install-recommends python3 python3-pip
            pip3 install -U pip
          run: |
            python3 -m pip install -t ./bundled/libs --implementation py --no-deps --upgrade -r ./requirements.txt

      # Alpine builds, which should select ty's musl binaries.
      - uses: jirutka/setup-alpine@ae3b3ddba35054804fc4a3507b519fa7e8152050 # v1.4.1
        if: ${{ startsWith(matrix.os, 'ubuntu') && endsWith(matrix.target, 'musl') }}
        with:
          arch: ${{ matrix.arch }}
      - shell: alpine.sh --root {0}
        if: ${{ startsWith(matrix.os, 'ubuntu') && endsWith(matrix.target, 'musl') }}
        run: |
          apk add --no-cache python3 py3-pip
          python3 -m pip install -t ./bundled/libs --implementation py --no-deps --upgrade -r ./requirements.txt

      # Every other architecture, which should defer to `pip` without any special treatment.
      - run: python -m pip install -t ./bundled/libs --implementation py --no-deps --upgrade -r ./requirements.txt
        if: ${{ !startsWith(matrix.os, 'macos')
          && !(startsWith(matrix.os, 'ubuntu') && !startsWith(matrix.target, 'x86_64') && !endsWith(matrix.target, 'musl'))
          && !(startsWith(matrix.os, 'ubuntu') && endsWith(matrix.target, 'musl')) }}

      # Install Node.
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          package-manager-cache: false

      # Install Node dependencies.
      - run: npm ci --ignore-scripts

      # Set the Build ID.
      - name: Set Build ID (release)
        if: needs.validate-release.outputs.prerelease == 'false'
        shell: bash
        run: |
          python -m build.update_ext_version --build-id "${BUILD_ID}" --for-publishing
        env:
          BUILD_ID: ${{ needs.validate-release.outputs.release-build-id }}
      - name: Set Build ID (nightly)
        if: needs.validate-release.outputs.prerelease == 'true'
        shell: bash
        run: |
          python -m build.update_ext_version --build-id "${BUILD_ID}" --for-publishing --pre-release
        env:
          BUILD_ID: ${{ needs.validate-release.outputs.nightly-build-id }}

      # Build the extension.
      - name: Package Extension (release)
        if: needs.validate-release.outputs.prerelease == 'false'
        shell: bash
        run: npx vsce package -o "./dist/ty-${{ matrix.code-target }}.vsix" --target ${{ matrix.code-target }}
      - name: Package Extension (nightly)
        if: needs.validate-release.outputs.prerelease == 'true'
        shell: bash
        run: npx vsce package -o "./dist/ty-${{ matrix.code-target }}.vsix" --target ${{ matrix.code-target }} --pre-release

      # Upload the extension.
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.target }}
          path: ./dist

  # Phase 3: Approve the release after all platform builds succeed.
  release-gate:
    # N.B. This name should not change; the release environment gate relies on it.
    name: release-gate
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: release-gate
    permissions: {}
    steps:
      - run: echo "Release approved"

  # Phase 4: Publish the built extension to both marketplaces.
  publish-code-marketplace:
    name: "Publish (Code Marketplace)"
    needs: ["validate-release", "release-gate"]
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      contents: read
    steps:
      - name: Install Nodejs
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          package-manager-cache: false

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ env.FETCH_DEPTH }}
          persist-credentials: false

      # Download all built artifacts.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-aarch64-apple-darwin
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-x86_64-apple-darwin
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-x86_64-unknown-linux-gnu
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-aarch64-unknown-linux-gnu
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-arm-unknown-linux-gnueabihf
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-x86_64-pc-windows-msvc
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-aarch64-pc-windows-msvc
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-x86_64-unknown-linux-musl
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-aarch64-unknown-linux-musl
          path: dist
      - run: ls -al ./dist

      # Install Node dependencies.
      - run: npm ci --ignore-scripts

      # Publish to the Code Marketplace.
      - name: Publish Extension (Code Marketplace, release)
        if: needs.validate-release.outputs.prerelease == 'false'
        run: npx vsce publish --packagePath ./dist/ty-*.vsix --skip-duplicate
        env:
          VSCE_PAT: ${{ secrets.MARKETPLACE_TOKEN }}
      - name: Publish Extension (Code Marketplace, nightly)
        if: needs.validate-release.outputs.prerelease == 'true'
        run: npx vsce publish --packagePath ./dist/ty-*.vsix --pre-release --skip-duplicate
        env:
          VSCE_PAT: ${{ secrets.MARKETPLACE_TOKEN }}

  publish-openvsx:
    name: "Publish (OpenVSX)"
    needs: ["validate-release", "release-gate"]
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      contents: read
    steps:
      - name: Install Nodejs
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          package-manager-cache: false

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ env.FETCH_DEPTH }}
          persist-credentials: false

      # Download all built artifacts.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-aarch64-apple-darwin
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-x86_64-apple-darwin
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-x86_64-unknown-linux-gnu
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-aarch64-unknown-linux-gnu
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-arm-unknown-linux-gnueabihf
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-x86_64-pc-windows-msvc
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-aarch64-pc-windows-msvc
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-x86_64-unknown-linux-musl
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-aarch64-unknown-linux-musl
          path: dist
      - run: ls -al ./dist

      # Install Node dependencies.
      - run: npm ci --ignore-scripts

      # Publish to OpenVSX.
      - name: Publish Extension (OpenVSX, release)
        if: needs.validate-release.outputs.prerelease == 'false'
        run: npx ovsx publish --packagePath ./dist/ty-*.vsix --skip-duplicate
        env:
          OVSX_PAT: ${{ secrets.OPENVSX_TOKEN }}
        timeout-minutes: 2
      - name: Publish Extension (OpenVSX, nightly)
        if: needs.validate-release.outputs.prerelease == 'true'
        run: npx ovsx publish --packagePath ./dist/ty-*.vsix --pre-release --skip-duplicate
        env:
          OVSX_PAT: ${{ secrets.OPENVSX_TOKEN }}
        timeout-minutes: 2

  # Phase 5: Create the tag and GitHub release after both publications succeed.
  publish-github:
    name: Create GitHub release
    needs: ["validate-release", "publish-code-marketplace", "publish-openvsx"]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub release and tag
        shell: bash
        run: |
          prerelease=()
          if [[ "$PRERELEASE" == "true" ]]; then
            prerelease+=(--prerelease)
          fi
          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_COMMIT" \
            --title "$VERSION" \
            --generate-notes \
            "${prerelease[@]}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ needs.validate-release.outputs.prerelease }}
          RELEASE_COMMIT: ${{ github.sha }}
          VERSION: ${{ inputs.version }}
