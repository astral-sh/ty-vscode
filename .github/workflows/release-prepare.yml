# Bump the extension and bundled ty versions and create a pull request.
name: Prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Extension version without a leading v (defaults to a minor bump of two)
        required: false
        type: string
      ty-version:
        description: Bundled ty version (defaults to the latest version on PyPI)
        required: false
        type: string

permissions: {}

jobs:
  prepare:
    name: Prepare release
    if: github.repository == 'astral-sh/ty-vscode' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # renovate: datasource=github-release-attachments depName=astral-sh/uv
          version: "0.13.7"
          checksum: "c5221ff41b7892bfc223543883600125f6a47fe845093e0f5bdff4f359196d83"
          python-version: "3.13"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.11.1"
          package-manager-cache: false

      - name: Bump version
        id: bump
        shell: bash
        run: |
          args=()
          if [[ -n "$VERSION" ]]; then
            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Invalid extension version: ${VERSION}"
              exit 1
            fi
            if git rev-parse --verify --quiet "refs/tags/${VERSION}" >/dev/null; then
              echo "::error::Tag ${VERSION} already exists"
              exit 1
            fi
            args+=(--new-version "$VERSION")
          fi
          if [[ -n "$TY_VERSION" ]]; then
            args+=(--new-ty "$TY_VERSION")
          fi
          uv run --locked scripts/release.py "${args[@]}"

          package_version="$(node -p 'require("./package.json").version')"
          if [[ -n "$VERSION" && "$package_version" != "$VERSION" ]]; then
            echo "::error::Requested version ${VERSION} was normalized to ${package_version}"
            exit 1
          fi
          echo "version=$package_version" >> "$GITHUB_OUTPUT"
        env:
          VERSION: ${{ inputs.version }}
          TY_VERSION: ${{ inputs.ty-version }}

      - name: Create or update pull request
        uses: astral-sh/github-actions/create-release-pr@b18ab2e0c11d16711c1818c8774babfa0203b909 # 2026.10.08.0
        with:
          version: ${{ steps.bump.outputs.version }}
