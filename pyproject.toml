[project]
name = "ty-vscode"
version = "2026.66.0"
requires-python = ">=3.8"
dependencies = ["ty==0.0.69"]

[tool.uv]
exclude-newer = "P7D"

[tool.ruff]
line-length = 88
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "Q", "UP", "I", "N"]

[dependency-groups]
dev = ["ruff>=0.16.2", "ty>=0.0.69", "uv>=0.12.3"]
